name: Deploy Hari.dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Dory API key
        run: |
          sed -i "s|__DORY_API_KEY__|${{ secrets.DORY_GEMINI_API_KEY }}|g" js/dory.js
          grep -q "AIza" js/dory.js \
            || echo "::warning::DORY_GEMINI_API_KEY secret is missing or not an AIza key — Dory will run in retrieval mode"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
